name: Deploy Multi-Target

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # RUNNER_SECRET disimpan sekali di GitHub Secrets, lalu disebar ke Worker & Space
      # SEBELUM kode baru live — kode baru menolak semua request internal tanpa secret ini.
      - name: Check RUNNER_SECRET
        env:
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: |
          if [ ${#RUNNER_SECRET} -lt 16 ]; then
            echo "::error::GitHub secret RUNNER_SECRET belum diset / kurang dari 16 karakter"
            exit 1
          fi

      - name: Sync RUNNER_SECRET to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: printf '%s' "$RUNNER_SECRET" | npx wrangler secret put RUNNER_SECRET

      - name: Sync RUNNER_SECRET to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: |
          body=$(jq -n --arg v "$RUNNER_SECRET" '{key: "RUNNER_SECRET", value: $v, description: "Shared secret Worker <-> Space"}')
          curl -sSf -m 30 -X POST "https://huggingface.co/api/spaces/thirapi/tg-bot-cocoa/secrets" \
            -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" -d "$body" > /dev/null

      # Konverter YouTube -> MP3 pribadi (scripts/yt-mp3-server). Opsional: kalau secret
      # GitHub-nya kosong, langkah ini dilewati dan tool youtubeMp3 fallback ke link YouTube.
      - name: Sync MP3 converter secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MP3_CONVERTER_URL: ${{ secrets.MP3_CONVERTER_URL }}
          MP3_CONVERTER_SECRET: ${{ secrets.MP3_CONVERTER_SECRET }}
        run: |
          if [ -z "$MP3_CONVERTER_URL" ] || [ -z "$MP3_CONVERTER_SECRET" ]; then
            echo "MP3_CONVERTER_URL/SECRET belum diset di GitHub Secrets, lewati"
            exit 0
          fi
          printf '%s' "$MP3_CONVERTER_URL" | npx wrangler secret put MP3_CONVERTER_URL
          printf '%s' "$MP3_CONVERTER_SECRET" | npx wrangler secret put MP3_CONVERTER_SECRET

      # Skema D1 idempoten (semua CREATE ... IF NOT EXISTS). Gagal = peringatan, bukan blokir deploy.
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute tg-bot-db --remote --file=src/db/schema.sql --yes || echo "::warning::D1 schema apply gagal — cek izin D1 pada CLOUDFLARE_API_TOKEN"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Sync & Deploy to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/thirapi/tg-bot-cocoa || true
          git push -f hf main
